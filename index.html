<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTravel — 나에게 맞는 국내 여행지</title>
    <meta name="description" content="숨은 국내 여행지 추천 퀴즈" />

    <!-- Open Graph (카카오톡·SNS 링크 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyTravel" />
    <meta property="og:url" content="https://my-travel-flax.vercel.app/" />
    <meta property="og:title" content="나에게 딱 맞는 여행지가 어딜까?" />
    <meta property="og:description" content="숨은 국내 여행지 추천 퀴즈" />
    <meta
      property="og:image"
      content="https://my-travel-flax.vercel.app/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://my-travel-flax.vercel.app/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="400" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="나에게 딱 맞는 여행지가 어딜까?" />
    <meta name="twitter:description" content="숨은 국내 여행지 추천 퀴즈" />
    <meta
      name="twitter:image"
      content="https://my-travel-flax.vercel.app/og-image.png"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mytravel-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
